name: Build Windows EXE and Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "BinanceLongScannerPro" --add-data "scanner_engine.py;." --add-data "notifier.py;." --add-data "updater.py;." main.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App-EXE
          path: dist/BinanceLongScannerPro.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Flet
        run: pip install -r requirements.txt
      - name: Build Android APK
        run: flet build apk --project "BinanceLongScannerPro" --org "com.matin51.scanner"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-App-APK
          path: build/apk/*.apk
